services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/incidents
      DB_USER: incident
      DB_PASSWORD: incident
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: